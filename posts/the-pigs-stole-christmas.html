<html lang="en">
<head>

<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="../"><img src="../assets/logo.png" alt=""><span>Flyer</span></a>
      <nav>
        <a href="hello-we-are-flyer.html">About</a>
        <a href="the-pigs-stole-christmas.html">Work</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <article>
      <header>
        <p class="kicker">Flyer · Pitch</p>
        <h1>The Pigs Stole Christmas</h1>
        <p class="lede">Albert Christmas campaign 2026.</p>
        <p class="post-meta"><time datetime="2026-10-15">15 October 2026</time></p>

      <!-- SLIDES: upload the exported deck as presentation/flyer-albert-christmas-2026.pdf and it appears here automatically. -->
      <section class="deck" id="deck">
        <div class="placeholder">The presentation will be published here.</div>
      </section>

  <footer class="site-footer">

      <span>© 2026 Flyer</span>

  <script>
    // Show the deck if the PDF has been uploaded; otherwise keep the placeholder.
    (function () {
      var src = "../presentation/flyer-albert-christmas-2026.pdf";
      fetch(src, { method: "HEAD" }).then(function (r) {
        if (!r.ok) return;
        document.getElementById("deck").innerHTML =
          '<iframe src="' + src + '" title="Flyer — The Pigs Stole Christmas (presentation)"></iframe>' +
          '<a class="btn" href="' + src + '" target="_blank" rel="noopener">Open the presentation ↗</a>';
      }).catch(function () {});
    })();
  </script>
